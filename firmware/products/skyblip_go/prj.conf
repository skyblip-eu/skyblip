# prj.conf: base Kconfig for skyBlip Go on Zephyr.

# C++: the whole point of the migration
# Modern GCC from the Zephyr SDK -> real C++20 on the nRF52 (impossible on the
# GCC-7/9 Arduino toolchain). Matches core's -fno-exceptions -fno-rtti profile.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y

# Peripherals (map to the hardware/platform/zephyr adapters)
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_PWM=y

# Sensor I2C: the BME280 barometer (I2C 0x76, "optional,
# selected"). Zephyr owns the chip - see hardware/platform/zephyr/baro.h for why
# there is no first-party driver. A unit without the part still boots: the
# application falls back to GNSS-derived vertical speed.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_HWINFO=y

# Battery sense: the SAADC behind the board's 100K/100K divider, read through
# Zephyr's voltage-divider sensor so the ratio stays a devicetree fact. The
# percentage is ours (core/power) because the curve is a property of the cell,
# not of the resistors.
CONFIG_ADC=y
CONFIG_VOLTAGE_DIVIDER=y

# Console / logging over USB CDC (the T-Echo has no debug UART)
# The USB device "next" stack (UDC API). The legacy USB_DEVICE_STACK is
# `select DEPRECATED` as of Zephyr 4.4 and is removed in 4.5.
#
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT is the next stack's equivalent of the legacy
# USB_DEVICE_INITIALIZE_AT_BOOT: subsys/usb/device_next/app/cdc_acm_serial.c
# builds the device context, registers the CDC ACM class and enables it from
# SYS_INIT, so no application code owns USB. It requires a devicetree node
# labelled `zephyr_udc0`, which the board file now provides.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="skyBlip"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="skyBlip Go"
# PLACEHOLDER IDS - MUST be replaced before any unit ships. 0x1209 is pid.codes'
# Vendor ID for open-source hardware and 0x0001 is one of its documented Test
# PIDs. Set explicitly rather than inheriting Zephyr's own 0x2fe3/0x0004, which
# its Kconfig states must not be used outside the Zephyr Project. A real PID has
# to be requested from pid.codes (free, and this firmware is GPLv3) or a Vendor
# ID bought from the USB-IF.
#
# Note this is the RUNNING APPLICATION's identity only. In bootloader mode the
# device presents the factory Adafruit descriptors (0x239A/0x0029, volume
# TECHOBOOT), which we do not control and must not change.
CONFIG_CDC_ACM_SERIAL_VID=0x1209
CONFIG_CDC_ACM_SERIAL_PID=0x0001
# Bus-powered: the T-Echo charges over the same port.
CONFIG_CDC_ACM_SERIAL_MAX_POWER=125
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# CDC ACM is still a UART device to the console: line control gives us DTR, so
# nothing is written into the void before a host actually opens the port.
CONFIG_UART_LINE_CTRL=y

# Durable settings (hal::KvStore -> NVS)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
# Writing flash at runtime (NVS, and staging the new image) needs the MPU to
# permit it. Without this the write silently fails on the nRF52840.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# External SPI NOR flash (secondary image slot + flight logs)
# slot1_partition lives under &ext_flash in the board devicetree, so the running
# application needs this driver to stage an update into it. (CONFIG_SPI is
# already on above for the radio and the panel.)
CONFIG_SPI_NOR=y
# THE POINT OF THIS DRIVER CHOICE. LilyGO fit either an MX25R1635F or a
# ZD25WQ16B "depending on availability" (their README). SFDP_RUNTIME compiles
# out the devicetree JEDEC-id check and reads geometry, page size, erase sizes
# and the quad-enable requirement from the chip itself, so one image serves both
# parts. Turning this off resurrects a hard -ENODEV on the other part, which
# means a unit that boots but can never be updated over the air. See
CONFIG_SPI_NOR_SFDP_RUNTIME=y
# Must match sysbuild/mcuboot.conf. This driver ALSO defaults its layout page
# size to the 64 KB block; MCUboot's swap-using-offset needs both slots to report
# the same 4096 B sector, and the uploader computes its one-sector write offset
# from it.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Erase internal pages in slices instead of blocking the CPU for a whole page.
# RADIO_SYNC_TICKER is already the default under BT_LL_SW_SPLIT
# (drivers/flash/Kconfig.nrf:37); partial erase is not, and a blocking 4 KB
# erase is long enough to disturb the ADS-L transmit cadence.
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y

# Bluetooth companion link (hardware/platform/zephyr/link.cpp)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="skyBlip"
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2

# Throughput settings for firmware upload over BLE. Values from Zephyr's own
# smp_svr sample (samples/subsys/mgmt/mcumgr/smp_svr/bt.conf).
#
# THIS IS A CEILING, NOT A PROMISE. The ATT MTU is negotiated: this is the most
# this peripheral will agree to, and what a connection actually settles at is up
# to the central - an iOS one commonly stops at 185, which is 182 bytes of
# notification payload once the three-byte header is off. Nothing may size a
# frame against this number. hardware/platform/zephyr/link.cpp reports the
# negotiated figure through hal::Link::payload_bytes() and refuses anything
# longer, because a notification over the payload is not truncated by the
# controller, it fails. No MTU exchange is requested from this side: that is a
# client operation, there is no CONFIG_BT_GATT_CLIENT here, and every central we
# serve initiates it on connect.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# CONFIG_BT_SMP IS DELIBERATELY OFF.
#
# Enabling it flips MCUMGR_TRANSPORT_BT_PERM to ..._RW_AUTHEN by default
# (subsys/mgmt/mcumgr/transport/Kconfig.bluetooth:29), and encrypted GATT
# characteristics are a known Web Bluetooth failure on Windows - which would
# break the browser update page that is the primary update path.
#
# The security boundary is therefore the IMAGE, not the link: MCUboot verifies
# an ECDSA-P256 signature over our key and refuses to boot anything else, and
# MCUBOOT_DOWNGRADE_PREVENTION refuses older versions. An open transport cannot
# install firmware. What it could otherwise do - waste the secondary slot, or
# force a reboot in flight - is refused by the upload and reset hooks below,
# which defer to core/dfu/update_policy (ground-only, fail-closed, confirmed on
# the e-paper, rate limited).
# for the configuration channel: no pairing, physical presence instead.

# Signed DFU over MCUmgr/SMP (hal::Dfu -> MCUboot)
# The image slot geometry and swap mode come from sysbuild; see sysbuild.conf.
CONFIG_BOOTLOADER_MCUBOOT=y
# Produce zephyr.signed.confirmed.bin as well as zephyr.signed.bin: the .uf2 and
# the factory line need an image that is already marked good, because a
# directly-written slot0 never went through a swap to confirm itself.
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
# MCUboot was built with MCUBOOT_DOWNGRADE_PREVENTION; the application has to
# agree or it will offer upgrades the bootloader will reject
# (share/sysbuild/images/bootloader/Kconfig:52-53).
CONFIG_MCUBOOT_BOOTLOADER_NO_DOWNGRADE=y

# IMG_MANAGER depends on STREAM_FLASH, and MCUMGR on NET_BUF + ZCBOR. Kconfig
# only WARNS when a requested symbol's dependencies are unmet - it downgrades it
# to n and builds anyway. Missing these meant IMG_MANAGER silently became n, so
# subsys/dfu/boot/mcuboot.c was never compiled and boot_request_upgrade() failed
# at link. Signed DFU would have been absent from a build that otherwise looked
# fine, which is worth stating rather than trusting the build to tell us.
CONFIG_STREAM_FLASH=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_REBOOT=y

CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
# Requesting a fast connection interval during an upload. Recommended by its own
# Kconfig help when SMP is used for DFU. It depends on a negative
# SYSTEM_WORKQUEUE_PRIORITY, which is already Zephyr's default (kernel/
# Kconfig:613) - so it is not restated here.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# Reject an oversized image at the first chunk instead of after a two-minute
# upload. Derives the real limit from the MCUboot image configuration.
CONFIG_MCUMGR_GRP_IMG_TOO_LARGE_SYSBUILD=y

# The hooks that replace link encryption
# UPLOAD_CHECK_HOOK is the one that matters: it "check[s] with the user
# application if an upload should be accepted or rejected"
# (subsys/mgmt/mcumgr/grp/img_mgmt/Kconfig:147-152). RESET_HOOK does the same
# for a reboot request. hardware/platform/zephyr/mcumgr_hooks.cpp forwards both to
# core/dfu/update_policy.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y

# Reboot into the factory drag-and-drop bootloader
# hal::Dfu::enter_recovery() writes 0x57 (DFU_MAGIC_UF2_RESET) to GPREGRET
# through the retention area declared on &gpregret1 in the board devicetree,
# then reboots. The factory bootloader then comes up as USB mass storage
# (volume TECHOBOOT) instead of starting MCUboot.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y
CONFIG_RETENTION=y

# Watchdog (hardware/platform/zephyr/watchdog.h)
# The nRF52840 WDT peripheral, driven through Zephyr's task watchdog so the
# decision to feed stays in runtime/ where the host suite can reach it.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
# The hardware fallback is the whole point: without it a stalled software
# channel only runs a callback, and a CPU that is wedged in an ISR never gets
# that far.
CONFIG_TASK_WDT_HW_FALLBACK=y
# The subsystem sizes the hardware window as MIN_TIMEOUT + HW_FALLBACK_DELAY.
# The application channel is runtime::kHardwareWatchdogMs (12 s, SoftRF's figure
# on this silicon), so these two put the peripheral at 14 s: strictly outside the
# channel, which is what makes the channel the first thing to expire and the
# callback that names the stalled service the first thing to run. MIN_TIMEOUT is
# also the floor task_wdt_add() rejects a shorter channel against, so it stays
# below 12 s rather than equal to it.
CONFIG_TASK_WDT_MIN_TIMEOUT=8000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=6000
CONFIG_TASK_WDT_CHANNELS=4

# SYSTEM OFF (hardware/platform/zephyr/system_power.h)
# sys_poweroff() is what reaches nrf_power_system_off(). Without it a long press
# has nowhere to go, and a receiver armed through 980 ms of every second flattens
# a T-Echo in a bag inside a day.
CONFIG_POWEROFF=y

# Runtime / diagnostics
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_ASSERT=y
