# prj.conf — base Kconfig for skyBlip Go on Zephyr.

# ---- C++ : the whole point of the migration --------------------------------
# Modern GCC from the Zephyr SDK → real C++20 on the nRF52 (impossible on the
# GCC-7/9 Arduino toolchain). Matches core's -fno-exceptions -fno-rtti profile.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y

# ---- Peripherals (map to the devices/soc/zephyr adapters) ------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_PWM=y
CONFIG_HWINFO=y

# ---- Console / logging over USB CDC (the T-Echo has no debug UART) ----------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="skyBlip Go"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# ---- Durable settings (hal::KvStore → NVS) ---------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
# Writing flash at runtime (NVS, and MCUboot staging the new image) needs the MPU
# to permit it. Without this the write silently fails on the nRF52840.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ---- Bluetooth companion link (§6, devices/soc/zephyr/ble.cpp) -------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="skyBlip"
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251

# ---- Secure signed DFU (hal::Dfu → MCUboot) --------------------------------
# The field-update win over Adafruit serial DFU. Enable the bootloader via
# sysbuild (sysbuild.conf) and image management over BLE SMP.
CONFIG_BOOTLOADER_MCUBOOT=y
# IMG_MANAGER depends on STREAM_FLASH, and MCUMGR on NET_BUF + ZCBOR. Kconfig
# only WARNS when a requested symbol's dependencies are unmet - it downgrades it
# to n and builds anyway. Missing these meant IMG_MANAGER silently became n, so
# subsys/dfu/boot/mcuboot.c was never compiled and boot_request_upgrade() failed
# at link. Signed DFU would have been absent from a build that otherwise looked
# fine, which is worth stating rather than trusting the build to tell us.
CONFIG_STREAM_FLASH=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_REBOOT=y

# ---- Runtime / diagnostics -------------------------------------------------
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_ASSERT=y
