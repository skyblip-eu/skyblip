# Kconfig fragment for the MCUboot image built by sysbuild (sysbuild.conf).
#
# MCUboot is a SEPARATE Zephyr application. It inherits the board devicetree -
# where `zephyr,console` is &cdc_acm_uart0 - but not this app's prj.conf, so it
# never builds the USB device stack. uart_console.c then references a device
# object that was never instantiated and the bootloader fails to link with
# `undefined reference to __device_dts_ord_96`.
#
# The T-Echo has no debug UART, so the bootloader has nowhere to print anyway:
# give it no console at all. Smaller bootloader, and one less thing to go wrong
# before the application is even running.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
