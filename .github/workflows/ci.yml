name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: host unit tests (doctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build & run host tests
        working-directory: firmware
        run: make test
      - name: test-coverage structural gate
        run: python3 scripts/check_test_coverage.py

  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED. `apt-get install clang-format` is whatever the runner image ships
      # (18 today) and the versions disagree: 18 mangles `struct spi_buf b{x, y}`
      # brace-init into a multi-line block. An unpinned formatter is a gate that
      # changes its mind on an image bump, so take the version from PyPI.
      - name: install clang-format
        run: pipx install clang-format==21.1.8
      - name: check formatting
        run: |
          find firmware/core firmware/ui firmware/hal firmware/devices \
               firmware/products firmware/test \
            -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  device-build:
    name: zephyr firmware build (t_echo_plus)
    runs-on: ubuntu-latest
    steps:
      # No `path:` - the repo root IS the app root, so firmware/ is at the top
      # level. The old `path: skyblip` nested it one level deeper than app-path
      # claimed, and `west init -l` then found no manifest to build a workspace
      # from: "no west workspace found".
      - uses: actions/checkout@v4

      # Installs west, fetches Zephyr + modules per firmware/west.yml, and
      # provisions the arm-zephyr-eabi SDK (modern GCC → C++20).
      - name: set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      - name: west build (sysbuild → MCUboot + app)
        working-directory: firmware
        run: |
          west build -b t_echo_plus . --sysbuild \
            -- -DBOARD_ROOT=$(pwd)

      # scripts/ is at the repo root, but the .elf is under firmware/build, so this
      # step runs from firmware/ and reaches back up for the script.
      - name: flash-size budget
        working-directory: firmware
        run: python3 ../scripts/size_check.py build/skyblip_go/zephyr/zephyr.elf 512000

      - name: upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t_echo_plus-firmware
          path: |
            firmware/build/skyblip_go/zephyr/zephyr.hex
            firmware/build/skyblip_go/zephyr/zephyr.bin
            firmware/build/**/zephyr.signed.bin
            firmware/build/**/merged.hex
          if-no-files-found: warn
