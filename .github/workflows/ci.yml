name: ci

# `push:` unqualified fires on EVERY branch push, and a push to a branch with an
# open PR also fires `pull_request` - so every commit ran the whole matrix twice,
# including the 5-minute Zephyr build. Pushes are watched on main only (the
# post-merge signal); everything else is covered by the PR event, and this repo
# never commits to main directly anyway.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job here only ever reads the repository. The device
# build's artifact upload uses the Actions runtime token, not this one.
permissions:
  contents: read

# Supersede in-flight runs on a branch when new commits land, but never cancel a
# run on main - that one is the record of what the merged tree does.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  host-tests:
    # arm64 ON PURPOSE: closer to the Cortex-M target than x86_64 is. Plain `char`
    # is unsigned on ARM and signed on x86, and unaligned access is less
    # forgiving - so the host suite now runs with the target's signedness rather
    # than one that hides a whole class of parser bug until it reaches hardware.
    name: host unit tests (doctest)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: build & run host tests
        working-directory: firmware
        run: make test
      - name: test-coverage structural gate
        run: python3 scripts/check_test_coverage.py

  lint:
    name: clang-format
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      # PINNED. `apt-get install clang-format` is whatever the runner image ships
      # (18 today) and the versions disagree: 18 mangles `struct spi_buf b{x, y}`
      # brace-init into a multi-line block. An unpinned formatter is a gate that
      # changes its mind on an image bump, so take the version from PyPI.
      - name: install clang-format
        run: pipx install clang-format==21.1.8
      - name: check formatting
        run: |
          find firmware/core firmware/ui firmware/hal firmware/hardware firmware/runtime \
               firmware/products firmware/simulator firmware/test \
            -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  product-image:
    # One entry per SKU, and the board is deliberately NOT listed: the product
    # owns that pair in its own CMakeLists, and naming it here would make CI a
    # second place to assert the one thing this layout made single.
    strategy:
      fail-fast: false
      matrix:
        product: [skyblip_go]
    name: product image (${{ matrix.product }})
    # x86_64 ON PURPOSE, unlike the host jobs. This is a CROSS build:
    # arm-zephyr-eabi-gcc emits the same bytes for the nRF52840 whichever
    # architecture the host is, so an arm64 runner buys nothing here. It costs
    # something though - on ubuntu-26.04-arm the Zephyr SDK fails to register
    # its CMake package and FindZephyr-sdk.cmake:57 dies on an empty variable
    # (`( zephyr STREQUAL )`). Keep the firmware image built by the combination
    # that is known to work.
    runs-on: ubuntu-24.04
    steps:
      # No `path:` - the repo root IS the app root, so firmware/ is at the top
      # level. The old `path: skyblip` nested it one level deeper than app-path
      # claimed, and `west init -l` then found no manifest to build a workspace
      # from: "no west workspace found".
      - uses: actions/checkout@v7

      # Installs west, fetches Zephyr + modules per firmware/west.yml, and
      # provisions the arm-zephyr-eabi SDK (modern GCC → C++20).
      - name: set up Zephyr
        # THIRD-PARTY, and it downloads and runs the toolchain that compiles this
        # firmware - so it is pinned to a commit, not to the mutable `v1` tag
        # (which moved on 2026-07-24). A compromised tag here would mean a
        # compromised compiler, silently, on a safety-critical image. GitHub-owned
        # actions above stay on major tags; anything else gets a SHA.
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1 @ 2026-07-24
        with:
          app-path: firmware
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      # MCUboot's Kconfig default signing key is its own PUBLISHED
      # root-ec-p256.pem, which everyone has - so a signature against it proves
      # nothing. The real path is injected as a sysbuild Kconfig fragment,
      # because Kconfig does not expand $(ENV) inside .conf fragments.
      #
      # Release builds use the key from Actions secrets. Ordinary CI runs get a
      # throwaway key generated here: it proves the signing path works end to end
      # without a distributable key ever being in the repo, and an artifact from a
      # PR build will not boot a production unit.
      - name: provision a signing key
        run: |
          python3 -m pip install --quiet imgtool
          if [ -n "${{ secrets.SKYBLIP_SIGNING_KEY_PEM }}" ]; then
            echo "${{ secrets.SKYBLIP_SIGNING_KEY_PEM }}" > "$RUNNER_TEMP/signing.pem"
            echo "using the release signing key"
          else
            imgtool keygen -k "$RUNNER_TEMP/signing.pem" -t ecdsa-p256
            echo "using an EPHEMERAL signing key (artifacts will not boot a production unit)"
          fi
          chmod 600 "$RUNNER_TEMP/signing.pem"
          echo "SB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"$RUNNER_TEMP/signing.pem\"" \
            > "$RUNNER_TEMP/signing.conf"
          cat "$RUNNER_TEMP/signing.conf"

      # The app dir IS the product, and the board comes out of the product's own
      # CMakeLists - sysbuild needs one named before the app is configured, and
      # the product refuses any other. Reading it here keeps CI from becoming a
      # second place where the pair is asserted.
      - name: west build (sysbuild → MCUboot + app)
        working-directory: firmware
        run: |
          product=${{ matrix.product }}
          board=$(sed -n 's/^skyblip_product_board(\(.*\))$/\1/p' \
                  products/$product/CMakeLists.txt)
          test -n "$board" || { echo "FAIL: $product declares no board"; exit 1; }
          echo "building $product for $board"
          west build -b "$board" products/$product --sysbuild \
            -- -DBOARD_ROOT=$(pwd)/hardware \
               -DSB_EXTRA_CONF_FILE="$RUNNER_TEMP/signing.conf"

      # Guards against silently regressing to a key anyone can sign with. The
      # default lives in the mcuboot module directory, so any resolved key path
      # under it is a failure regardless of which algorithm was chosen.
      - name: assert the image was not signed with MCUboot's published key
        working-directory: firmware
        run: |
          key=$(grep -h '^CONFIG_BOOT_SIGNATURE_KEY_FILE=' build/mcuboot/zephyr/.config | cut -d'"' -f2)
          echo "signing key: $key"
          case "$key" in
            "") echo "FAIL: no signing key configured"; exit 1 ;;
            *bootloader/mcuboot*|*root-ec-p256.pem|*root-rsa-2048.pem|*root-ed25519.pem)
              echo "FAIL: signed with an MCUboot sample key"; exit 1 ;;
          esac

      # scripts/ is at the repo root, but the .elf is under firmware/build, so this
      # step runs from firmware/ and reaches back up for the script.
      - name: flash-size budget
        working-directory: firmware
        run: python3 ../scripts/size_check.py build/${{ matrix.product }}/zephyr/zephyr.elf

      - name: list build artifacts
        if: always()
        working-directory: firmware
        run: find build -maxdepth 3 -name '*.hex' -o -name '*.bin' -o -name '*.uf2' | sort

      # Merges the two sysbuild images (vanilla sysbuild emits no combined hex -
      # that is an NCS feature) and guards that the result cannot land on the
      # factory MBR/SoftDevice or above the bootloader's silent write ceiling.
      # The application image must be the CONFIRMED one: a slot0 written directly
      # never swaps, so it never marks itself good and would be reverted.
      - name: build the drag-and-drop .uf2
        working-directory: firmware
        run: |
          product=${{ matrix.product }}
          python3 ../scripts/mkuf2.py "build/${product//_/-}.uf2" \
            build/mcuboot/zephyr/zephyr.hex \
            "build/$product/zephyr/zephyr.signed.confirmed.hex"

      - name: upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.product }}-firmware
          path: |
            firmware/build/*.uf2
            firmware/build/${{ matrix.product }}/zephyr/zephyr.signed.bin
            firmware/build/${{ matrix.product }}/zephyr/zephyr.signed.confirmed.bin
          if-no-files-found: error

  platform-adapters:
    # What the pure-host suite cannot link: the Zephyr-backed adapters (NVS, SMP,
    # GATT plumbing). native_sim needs no board and no cross toolchain, and this
    # is about the platform rather than any one product - hence its own job
    # instead of a step that would repeat for every SKU in the matrix.
    name: platform adapters (native_sim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1 @ 2026-07-24
        with:
          app-path: firmware
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      - name: twister
        working-directory: firmware
        run: |
          # ZEPHYR_BASE is not exported into this step's env, so ask west where
          # the workspace is instead of guessing a path.
          python3 "$(west topdir)/zephyr/scripts/twister" \
            -T test/twister -p native_sim --inline-logs
