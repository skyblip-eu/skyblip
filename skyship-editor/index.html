<!DOCTYPE html>
<!-- skyShip editor - skyBlip's ownship symbol, for firmware/ui/screens/radar.cpp.
     Open directly (file://) - no server, no build, no dependencies.
     Draw -> copy the C++ block, or save the art and run:
         python3 apply.py skyship.txt
     which rewrites the compiled default in radar.cpp in place. -->
<meta charset="utf-8">
<title>skyShip editor</title>
<style>
  :root { --ink:#0B1220; --paper:#F4F1EA; --orange:#FF4F1F; --grey:#8DA3B8; }
  body { margin:0; padding:24px; background:#11161f; color:#dfe6ef;
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  h1 { font-size:15px; margin:0 0 16px; letter-spacing:.08em; text-transform:uppercase; }
  h1 span { color:var(--grey); text-transform:none; letter-spacing:0; }
  .row { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .panel { background:#181f2b; border:1px solid #263041; border-radius:8px; padding:14px; }
  .panel h2 { font-size:11px; margin:0 0 10px; color:var(--grey);
              text-transform:uppercase; letter-spacing:.1em; }
  canvas { display:block; image-rendering:pixelated; }
  #grid { cursor:crosshair; background:#0e131b; }
  #screen { background:#c9cbc4; border-radius:4px; }
  button, select, label { font:inherit; }
  button { background:#222c3b; color:#dfe6ef; border:1px solid #35425a; border-radius:5px;
           padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--orange); }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  textarea { width:430px; height:330px; background:#0e131b; color:#c9d3e0;
             border:1px solid #263041; border-radius:5px; padding:8px; font:inherit;
             white-space:pre; }
  .warn { color:#ffb454; } .ok { color:#7fd18c; } .dim { color:var(--grey); }
  ul { margin:6px 0 0; padding-left:18px; } li { margin:2px 0; }
  input[type=file] { color:var(--grey); }
</style>

<h1>skyShip editor <span>&mdash; the ownship symbol &middot; firmware/ui/screens/radar.cpp : kOwnshipRows[]</span></h1>

<div class="row">
  <div class="panel">
    <div class="bar">
      <label><input type="checkbox" id="sym" checked> mirror</label>
      <label><input type="checkbox" id="gridlines" checked> grid</label>
      <button data-rows="-1">&minus; row</button><button data-rows="1">+ row</button>
      <button data-cols="-1">&minus; col</button><button data-cols="1">+ col</button>
      <button data-wing="-2" title="scale the wing rows only; fuselage, prop and tail keep their width">&minus; wing span</button><button data-wing="2">+ wing span</button>
      <button id="toeven" title="convert to even width: straddle the screen centre point (99|100) instead of sitting half a pixel off it">&rarr; even</button>
      <button id="trim" title="drop blank rows/columns at the edges: they offset the centring">trim</button>
      <label title="the aircraft's POSITION on the glyph; this row sits on the plot origin">hot spot row <input id="origin" type="number" min="0" style="width:3.5em"></label>
      <button id="clear">clear</button>
    </div>
    <canvas id="grid"></canvas>
    <div class="bar" style="margin:10px 0 0">
      <select id="preset"></select>
      <label class="dim">replace outline: <input type="file" id="trace" accept="image/*"></label>
    </div>
  </div>

  <div class="panel">
    <h2>on screen &mdash; 200&times;200, 2&times;</h2>
    <canvas id="screen" width="400" height="400"></canvas>
    <div id="stats" class="dim" style="margin-top:10px"></div>
    <div id="checks"></div>
    <h2 style="margin-top:16px">vs the reference outline</h2>
    <div class="bar">
      <label><input type="checkbox" id="ghost" checked> ghost under grid</label>
    </div>
    <canvas id="diff"></canvas>
    <div id="fid" class="dim" style="margin-top:8px"></div>
  </div>

  <div class="panel">
    <h2>C++ &mdash; paste into radar.cpp</h2>
    <div class="bar">
      <button id="copy">copy</button>
      <button id="copyart">copy art only</button>
      <button id="paste">import from clipboard</button>
      <span id="copied" class="dim"></span>
    </div>
    <textarea id="out" spellcheck="false"></textarea>
  </div>
</div>

<script>
const PRESETS = {
  skyship: { label: "skyShip — current (24x16)", art: `...........##...........
........########........
..........####..........
..........####..........
..####################..
########################
########################
..####################..
.....##############.....
..........####..........
...........##...........
...........##...........
........########........
.......##########.......
........########........
...........##...........` },
};

// A low-wing single in plan, nose-up, mirror-symmetrised - the reference shape
// the sprite is hinted against. Load your own with the file input to override.
const REF_OUTLINE = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOgAAACsAQAAAABZG92vAAABrklEQVR42u1YzW7CMAz+YqrBDY67wWGPUQm0J9mbwJNN3RvsEXrdrZOQFk1ZvENZyU/jrS0TFPFdSvIR20ltxy7g4d4fEiQE7EP/tbPHhfDfJWth7QqZwG6CsfJGHEx0sFkB2PU+q2tjCcDmdhoHZABWo7I5D56On7MPz+e3HMIeo4zbdKpa77yVBFftUo/S1cSkN/Si5lWafScpycxoJbAZbaSDHPIWFF9bLEwgHBYP0lsIpB0kuRRIQ4JbQf8iWQtkRYI7oyQrsIWC4DqK/OspvPewTEaZBiG9YQ3CPsm+QiFtlgIh6RxfAIBpwqiyzh2cEgyKy5cD3v6SkRCUEYeM4tQM3LYywLS2tFccGQDlGeLXAijGnnNOVtedjd0FDjYGmwvYK6vrSpjR2VxBX6BVOrhDxu8bxk/PF2KVhVQUzVkoXSbMXCSzKIczrt51c2W1Kq1RuTVho+Pjp+JWRSyZnM49nsucrj9mZ82vxa0P/UdWO5mnl+TnFGucPByzFgC2CMsVtxnNmxY0wh3bfMtPyY9MJl/rpM2Vt+0Yebf+yMPnvsNXtU5rT/j2vwGHUdnBoF+CxgAAAABJRU5ErkJggg==";

const CELL = 15, RING_OUTER = 92, RING_INNER = 46;
const artOf = k => PRESETS[k].art.split("\n").map(r => [...r].map(c => c === "#" ? 1 : 0));
let g = artOf("skyship");
// The outline to work against: the built-in one, or any image you load over it.
let trace = null;                       // the outline image, ghosted under the grid
let tracePix = null;                    // {w,h,a} sampled from it, for scoring
const gridC = document.getElementById("grid"), gx = gridC.getContext("2d");
const scrC = document.getElementById("screen"), sx = scrC.getContext("2d");
const $ = id => document.getElementById(id);

const W = () => g[0].length, H = () => g.length;

function set(r, c, v) {
  if (r < 0 || r >= H() || c < 0 || c >= W()) return;
  g[r][c] = v;
  if ($("sym").checked) g[r][W() - 1 - c] = v;
}

function drawGrid() {
  gridC.width = W() * CELL + 1; gridC.height = H() * CELL + 1;
  gx.fillStyle = "#0e131b"; gx.fillRect(0, 0, gridC.width, gridC.height);
  const under = $("ghost").checked ? trace : null;
  if (under && under.complete) {
    // Faint underlay at the outline's OWN aspect ratio, fitted inside the grid and
    // centred. Never stretched to W x H: the reference (232x172 = 1.35) is not the
    // grid's 24x16 (1.5), so filling the grid would distort the aeroplane and you
    // would trace a shape that disagrees with trace.py and with the IoU below.
    // Fitting by width alone would make it 24*172/232 = 17.8 rows tall and the
    // canvas would clip the nose and tail. So scale by whichever axis binds: the
    // leftover margin IS the signal — it shows how much span the 24 px sprite
    // borrows from proportion to stay legible at 1 bit (see radar.cpp).
    const s = Math.min(W() * CELL / under.naturalWidth, H() * CELL / under.naturalHeight);
    const gw = under.naturalWidth * s, gh = under.naturalHeight * s;
    gx.globalAlpha = 0.28;
    gx.drawImage(under, (W() * CELL - gw) / 2, (H() * CELL - gh) / 2, gw, gh);
    gx.globalAlpha = 1;
  }
  for (let r = 0; r < H(); r++) for (let c = 0; c < W(); c++) {
    if (!g[r][c]) continue;
    gx.fillStyle = "#F4F1EA";
    gx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 1, CELL - 1);
  }
  const oy = origin() * CELL + CELL / 2 + .5;     // hot-spot row: sits on the origin
  gx.strokeStyle = "#FF4F1F"; gx.lineWidth = 1;
  gx.beginPath(); gx.moveTo(0, oy); gx.lineTo(gridC.width, oy); gx.stroke();
  if ($("gridlines").checked) {
    gx.strokeStyle = "#222c3b"; gx.lineWidth = 1;
    for (let c = 0; c <= W(); c++) { gx.beginPath(); gx.moveTo(c*CELL+.5, 0); gx.lineTo(c*CELL+.5, gridC.height); gx.stroke(); }
    for (let r = 0; r <= H(); r++) { gx.beginPath(); gx.moveTo(0, r*CELL+.5); gx.lineTo(gridC.width, r*CELL+.5); gx.stroke(); }
    // The mirror axis. Even width -> it is a pixel BOUNDARY, which is what the
    // 200x200 screen wants (its centre is the 99|100 corner, not a pixel).
    // Odd width -> the middle of a column, i.e. half a pixel off centre.
    const ax = W() % 2 ? (W() >> 1) * CELL + CELL / 2 : (W() >> 1) * CELL;
    gx.strokeStyle = W() % 2 ? "#FF4F1F55" : "#FF4F1F";
    gx.beginPath(); gx.moveTo(ax + .5, 0); gx.lineTo(ax + .5, gridC.height); gx.stroke();
  }
}

function drawScreen() {                            // exactly what draw_radar() does
  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.fillStyle = "#c9cbc4"; sx.fillRect(0, 0, 400, 400);
  sx.scale(2, 2);
  sx.strokeStyle = "#0B1220"; sx.lineWidth = 0.5;
  for (const r of [RING_OUTER, RING_INNER]) { sx.beginPath(); sx.arc(100, 100, r, 0, 7); sx.stroke(); }
  sx.strokeStyle = "#FF4F1F";                             // the centre POINT where
  sx.strokeRect(95.5, 95.5, 8, 8);                        // pixels 99|100 meet - every
  sx.strokeStyle = "#0B1220";                             // offset starts from there
  sx.fillStyle = "#0B1220";                        // sample traffic, for crowding
  sx.beginPath(); sx.arc(132, 64, 4, 0, 7); sx.fill();
  for (const [x, y, r] of [[70, 120, 2], [112, 150, 4]]) { sx.beginPath(); sx.arc(x, y, r, 0, 7); sx.stroke(); }
  // Placed by the HOT SPOT, exactly as draw_ownship() does: the row holding the
  // aircraft's position lands on the origin. Bbox-centring instead would put a
  // long-tailed aeroplane's wing several px forward and skew every bearing.
  // even width straddles the 99|100 centre point; the hot-spot row sits on 99
  const x0 = 100 - (W() >> 1), y0 = 99 - origin();
  for (let r = 0; r < H(); r++) for (let c = 0; c < W(); c++)
    if (g[r][c]) sx.fillRect(x0 + c, y0 + r, 1, 1);
}

// Hot-spot row: explicit if set, else the widest (wing) row - the CG, near enough.
function origin() {
  const box = $("origin");
  let widest = 0;
  g.forEach((r, i) => {
    const n = r.reduce((s, v) => s + v, 0);
    if (n > g[widest].reduce((s, v) => s + v, 0)) widest = i;
  });
  if (box.value === "" || +box.value >= H()) { box.placeholder = widest; return widest; }
  return +box.value;
}

function art() { return g.map(r => r.map(v => v ? "#" : ".").join("")).join("\n"); }

function cpp() {
  const lines = g.map(r => {
    const bits = r.reduce((a, v, i) => a + (v ? 2 ** i : 0), 0);
    return `    0x${bits.toString(16).padStart(8, "0")},  // ${r.map(v => v ? "#" : ".").join("")}`;
  });
  return `constexpr int kGlyphW = ${W()};\nconstexpr int kGlyphOriginRow = ${origin()};\n`
       + `constexpr uint32_t kOwnshipRows[] = {\n${lines.join("\n")}\n};`;
}

function checks() {
  const out = [], cx = W() >> 1;
  const ink = g.flat().reduce((a, v) => a + v, 0);
  const rows = g.map(r => r.reduce((a, v) => a + v, 0));
  // loose pixels: a dot with no 4-neighbour reads as traffic on a collision display
  let loose = 0;
  for (let r = 0; r < H(); r++) for (let c = 0; c < W(); c++) {
    if (!g[r][c]) continue;
    const n = (g[r-1]?.[c] || 0) + (g[r+1]?.[c] || 0) + (g[r][c-1] || 0) + (g[r][c+1] || 0);
    if (!n) loose++;
  }
  if (W() % 2) out.push(`<li class="warn">odd width (${W()}) &mdash; the axis lands half a pixel off the screen centre; even width straddles the 99|100 point exactly</li>`);
  let asym = 0;
  for (let r = 0; r < H(); r++) for (let c = 0; c < W(); c++) if (g[r][c] !== g[r][W()-1-c]) asym++;
  if (asym) out.push(`<li class="warn">${asym} px not mirrored</li>`);
  if (loose) out.push(`<li class="warn">${loose} loose px (no neighbour) &mdash; reads as a traffic dot</li>`);
  if (rows.some((v, i) => v === 0 && rows.slice(0, i).some(x => x) && rows.slice(i).some(x => x)))
    out.push(`<li class="warn">blank row inside the glyph &mdash; tail will look detached</li>`);
  // on an even grid the spine is a PAIR of pixels, never one
  const spine = g.map(r => W() % 2 ? r[cx] : (r[cx - 1] && r[cx])).filter(v => v).length;
  if (spine < H()) out.push(`<li class="warn">centreline broken on ${H() - spine} row(s)</li>`);
  if (!out.length) out.push(`<li class="ok">no issues</li>`);
  $("checks").innerHTML = `<ul>${out.join("")}</ul>`;
  $("stats").innerHTML =
    `${W()} &times; ${H()} px &middot; span/length ${(W() / H()).toFixed(2)} &middot; ${ink} px ink<br>` +
    `<span class="dim">screen 200 &times; 200, range rings at 46 and 92 px</span>`;
}

// Rasterise the loaded outline to the current grid by area coverage, exactly as
// trace.py does (Image.BOX + threshold), so the editor and the CLI agree on the
// shape being compared.
function refGrid() {
  const r = tracePix;
  if (!r) return null;
  const w = W(), h = H(), out = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    const y0 = Math.floor(y * r.h / h), y1 = Math.max(y0 + 1, Math.floor((y + 1) * r.h / h));
    for (let x = 0; x < w; x++) {
      const x0 = Math.floor(x * r.w / w), x1 = Math.max(x0 + 1, Math.floor((x + 1) * r.w / w));
      let ink = 0, n = 0;
      for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) { ink += r.a[yy * r.w + xx]; n++; }
      row.push(ink / n >= 0.45 ? 1 : 0);
    }
    out.push(row);
  }
  return out;
}

// IoU the way trace.py scores it: blow the sprite up to the outline's own
// resolution (nearest) and compare areas. Aspect differences are normalised
// away by that stretch, so this is a SHAPE score - watch span/length separately.
function fidelity() {
  const r = tracePix;
  if (!r) return null;
  let inter = 0, uni = 0, missing = 0, extra = 0, refInk = 0;
  for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
    const gv = g[Math.floor(y * H() / r.h)][Math.floor(x * W() / r.w)];
    const rv = r.a[y * r.w + x];
    if (gv && rv) inter++;
    if (gv || rv) uni++;
    if (rv && !gv) missing++;
    if (gv && !rv) extra++;
    if (rv) refInk++;
  }
  return { iou: inter / uni, missing: missing / refInk, extra: extra / refInk };
}

function drawDiff() {
  const rg = refGrid(), d = $("diff"), dx = d.getContext("2d");
  const cell = 8;
  d.width = W() * cell; d.height = rg ? H() * cell : 0;
  if (!rg) {
    $("fid").innerHTML = '<span class="dim">no outline loaded.</span>';
    return;
  }
  dx.fillStyle = "#181f2b"; dx.fillRect(0, 0, d.width, d.height);
  for (let y = 0; y < H(); y++) for (let x = 0; x < W(); x++) {
    const a = g[y][x], b = rg[y][x];
    if (!a && !b) continue;
    dx.fillStyle = a && b ? "#F4F1EA" : a ? "#FF4F1F" : "#8DA3B8";
    dx.fillRect(x * cell, y * cell, cell, cell);
  }
  const f = fidelity();
  $("fid").innerHTML =
    `IoU <b>${f.iou.toFixed(3)}</b> &middot; ` +
    `<span style="color:#8DA3B8">missing ${(f.missing * 100).toFixed(0)}%</span> &middot; ` +
    `<span style="color:#FF4F1F">extra ${(f.extra * 100).toFixed(0)}%</span><br>` +
    `<span class="dim">shape only &mdash; the stretch normalises aspect away, so watch ` +
    `span/length (${(W() / H()).toFixed(2)}) separately. Anything the outline does ` +
    `not draw scores as “extra”.</span>`;
}

function redraw() {
  drawGrid(); drawScreen(); drawDiff(); $("out").value = cpp(); checks();
  // survive a reload, and let anyone (or an agent on --cdp 9222) read the state
  try { localStorage.setItem("skyblip.skyship", art()); } catch {}
  window.skyship = { art: art(), cpp: cpp, w: W(), h: H() };
}

// ---- input ------------------------------------------------------------------
let painting = null;
gridC.addEventListener("pointerdown", e => {
  const r = Math.floor(e.offsetY / CELL), c = Math.floor(e.offsetX / CELL);
  painting = g[r]?.[c] ? 0 : 1;
  set(r, c, painting); redraw(); gridC.setPointerCapture(e.pointerId);
});
gridC.addEventListener("pointermove", e => {
  if (painting === null) return;
  set(Math.floor(e.offsetY / CELL), Math.floor(e.offsetX / CELL), painting); redraw();
});
addEventListener("pointerup", () => painting = null);

document.querySelectorAll("[data-rows]").forEach(b => b.onclick = () => {
  const d = +b.dataset.rows;
  if (d > 0) g.push(Array(W()).fill(0)); else if (H() > 1) g.pop();
  redraw();
});
document.querySelectorAll("[data-cols]").forEach(b => b.onclick = () => {
  const d = +b.dataset.cols;
  if (d > 0) g = g.map(r => [...r, 0]);        // grow/shrink on the right, so the
  else if (W() > 3) g = g.map(r => r.slice(0, -1));   // parity can actually change
  redraw();
});
// Narrow or widen the WINGS only: rows whose ink spans >= 11 px are scaled
// horizontally, everything else (fuselage, propeller, tailplane) keeps its
// measured width. Runs are scaled by their end offsets so the taper survives.
document.querySelectorAll("[data-wing]").forEach(b => b.onclick = () => {
  const target = W() + (+b.dataset.wing);
  if (target < 5) return;
  const s = target / W(), cx = W() >> 1, ncx = target >> 1;
  g = g.map(row => {
    const out = Array(target).fill(0);
    const ink = row.flatMap((v, i) => v ? [i] : []);
    const wing = ink.length && (ink[ink.length - 1] - ink[0] + 1) >= 11;
    let start = null;
    row.concat(0).forEach((v, i) => {
      if (v && start === null) start = i;
      if (!v && start !== null) {
        let a = start - cx, b = i - 1 - cx;
        if (wing) { a = Math.round(a * s); b = Math.round(b * s); }
        for (let d = a; d <= b; d++) if (ncx + d >= 0 && ncx + d < target) out[ncx + d] = 1;
        start = null;
      }
    });
    return out;
  });
  redraw();
});
$("trim").onclick = () => {
  while (g.length > 1 && !g[0].some(v => v)) g.shift();
  while (g.length > 1 && !g[g.length - 1].some(v => v)) g.pop();
  while (W() > 3 && !g.some(r => r[0] || r[W() - 1])) g = g.map(r => r.slice(1, -1));
  redraw();
};
// Same rule as apply.py --to-even: each row keeps its outer
// extent, the single middle pixel becomes a pair, 1 px features become 2 px.
$("toeven").onclick = () => {
  if (W() % 2 === 0) return;
  const ax = W() >> 1, w = W() - 1;
  g = g.map(row => {
    const out = Array(w).fill(0);
    let start = null;
    row.concat(0).forEach((v, i) => {
      if (v && start === null) start = i;
      if (!v && start !== null) {
        const a = start, b = i - 1;
        if (a <= ax && ax <= b) {
          const r = Math.max(1, (b - a) >> 1);
          for (let x = ax - r; x < ax + r; x++) out[x] = 1;
        } else {
          const d = Math.abs(((a + b) >> 1) - ax);
          for (const x of [ax - d, ax - 1 + d]) if (x >= 0 && x < w) out[x] = 1;
        }
        start = null;
      }
    });
    return out;
  });
  redraw();
};
$("clear").onclick = () => { g = g.map(r => r.map(() => 0)); redraw(); };
$("sym").onchange = $("gridlines").onchange = $("ghost").onchange = redraw;
$("origin").oninput = redraw;
$("preset").innerHTML = '<option value="">load&hellip;</option>' +
  Object.entries(PRESETS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
$("preset").onchange = e => {
  const p = PRESETS[e.target.value];
  if (!p) return;
  g = artOf(e.target.value);
  $("origin").value = "";
  e.target.value = ""; redraw();
};
// Sample an outline once: dark pixels are the airframe, then mirror it so the
// score is not punished for the drawing sitting a degree or two off square.
function useOutline(src) {
  const img = new Image();
  img.onload = () => {
    trace = img;              // an Image: drawGrid() fits it by its natural size
    const w = Math.min(240, img.width), h = Math.round(img.height * w / img.width);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data;
    const a = new Uint8Array(w * h);
    for (let i = 0; i < a.length; i++)
      a[i] = ((d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3 < 128 && d[i * 4 + 3] > 64) ? 1 : 0;
    // An outline is mostly background: if "ink" came out the majority, the image
    // was light-on-dark, so flip it. Saves guessing at what you loaded.
    let ink = 0;
    for (let i = 0; i < a.length; i++) ink += a[i];
    if (ink > a.length / 2) for (let i = 0; i < a.length; i++) a[i] ^= 1;
    for (let y = 0; y < h; y++)
      for (let k = 0; k < w >> 1; k++) {
        const l = y * w + k, r = y * w + w - 1 - k;
        a[l] = a[r] = a[l] | a[r];
      }
    tracePix = { w, h, a };
    redraw();
  };
  img.src = src;
}
$("trace").onchange = e => {
  const f = e.target.files[0];
  if (f) useOutline(URL.createObjectURL(f));
};
// A file:// page cannot always reach the async clipboard API (no permission,
// or no user activation). Fall back to selecting the textarea and execCommand,
// and if even that is blocked, say so rather than failing silently.
async function copyOut(text, what) {
  const note = m => { $("copied").textContent = m; setTimeout(() => $("copied").textContent = "", 2500); };
  try {
    await navigator.clipboard.writeText(text);
    note("copied " + what);
    return;
  } catch {}
  const ta = $("out"), keep = ta.value;
  ta.value = text; ta.focus(); ta.select();
  const ok = document.execCommand && document.execCommand("copy");
  if (!ok) { note("press " + (navigator.platform.match(/Mac/) ? "\u2318C" : "Ctrl+C") + " - text selected"); return; }
  if (text !== keep) ta.value = keep;
  note("copied " + what);
}
$("copy").onclick = () => copyOut(cpp(), "C++");
$("copyart").onclick = () => copyOut(art(), "art");
$("paste").onclick = async () => {
  try { load(await navigator.clipboard.readText()); }
  catch { $("copied").textContent = "paste into the box below instead"; }
};
$("out").addEventListener("paste", e => {
  setTimeout(() => load($("out").value), 0);
});

function load(text) {                              // accepts the C++ table or plain art
  // Hex wins when present: the generator prints the art as comments AND the
  // table, so reading art would count every row twice. The lookbehind stops
  // "200x200," in a comment parsing as the literal 0x200.
  const hex = [...text.matchAll(/(?<![0-9a-zA-Z])0x([0-9a-fA-F]{1,8})\s*,/g)].map(m => parseInt(m[1], 16));
  const artRows = text.split("\n").map(l => (l.match(/[#.]{5,}/) || [])[0]).filter(Boolean);
  if (hex.length > 2) {
    const w = (text.match(/kGlyphW\s*=\s*(\d+)/) || [, 30])[1] | 0;
    g = hex.map(v => Array.from({ length: w }, (_, i) => (v >> i) & 1));
  } else if (artRows.length > 2) {
    const w = Math.max(...artRows.map(r => r.length));
    g = artRows.map(r => [...r.padEnd(w, ".")].map(c => c === "#" ? 1 : 0));
  } else return;
  redraw();
}
useOutline(REF_OUTLINE);

  if (saved) g = saved.split("\n").map(r => [...r].map(c => c === "#" ? 1 : 0));
} catch {}
redraw();
